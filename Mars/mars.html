<!doctype html>
<html lang="en" class="storytelling-active">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090807">
  <meta name="description" content="An evidence-led archive of Mars missions, told by Leo and Dr. Fredrick.">
  <title>Project Ghost Signal — Mars Archive</title>
  <link rel="stylesheet" href="./mars.css">
  <link rel="stylesheet" href="./mars-storytelling.css?v=mars-layout-alignment-20261112">
  <link rel="stylesheet" href="../location-view.css?v=atlas-mobile-layout-20261111b">
  <link rel="stylesheet" href="../Audio/background-music.css">
</head>
<body class="storytelling-active">
  <audio id="backgroundMusic" class="background-music-audio" src="../Audio/Piano.mp3" loop preload="auto"></audio>
  <main class="museum-exhibit">
    <section id="ranger-story" class="ranger-story museum-scene is-mission-opening" aria-labelledby="story-title">
      <div class="mars-environment" aria-hidden="true"></div>
      <section class="holographic-monitor-layer" aria-label="Mars holographic display">
        <div class="story-image-frame" aria-label="Mission image aperture">
          <div class="mission-image-layout">
            <div id="mission-image-visual" class="mission-image-visual">
              <img id="story-hardware-primary" class="story-hardware" alt="" hidden>
              <img id="story-hardware-secondary" class="story-hardware" alt="" hidden>
            </div>
          </div>
        </div>
      </section>
      <header class="story-topbar">
        <a class="story-back-link" href="../Space/space.html">Space Library</a>
        <div class="story-heading">
          <p>Mars archive</p>
          <h1 id="story-title" tabindex="-1">The Red Planet Archive</h1>
          <span id="story-mission-status" class="mission-status">ARCHIVE</span>
        </div>
        <div class="story-topbar-actions">
          <button id="story-mission-index-button" class="story-mission-index-button" type="button" aria-expanded="false" aria-controls="story-mission-index">Mission index</button>
          <button id="landing-location-button" class="story-mission-index-button" type="button">LANDING LOCATION</button>
          <button id="soundToggleBtn" class="story-mission-index-button story-sound-toggle" type="button" aria-label="Play background music" aria-pressed="false" onclick="window.backgroundMusic.toggle()"><span id="soundStatusText">Audio</span></button>
        </div>
      </header>

      <nav id="story-mission-index" class="mission-index" aria-label="Mars archive sections" hidden></nav>

      <p id="story-mission-indicator" class="story-mission-indicator" aria-live="polite"></p>

      <div class="story-stage">
        <section class="story-conversation" aria-label="Mars mission dialogue">
          <div id="guide-stage" class="story-character-row story-guide-row" hidden>
            <figure class="story-guide">
              <img id="guide-character" src="../images/Guide_speaking.png" alt="Dr. Fredrick, Mars mission scientist">
            </figure>
            <section class="story-dialogue" aria-label="Dr. Fredrick speaking">
              <p class="dialogue-eyebrow"><span id="dialogue-speaker">Dr. Fredrick</span><span id="dialogue-progress"></span></p>
              <p id="ranger-dialogue" class="dialogue-copy" aria-live="polite"></p>
              <div class="dialogue-actions">
                <button id="play-narration" class="dialogue-play" type="button">Play voice narration</button>
                <button id="continue-reading" class="dialogue-reading" type="button" hidden>Continue reading</button>
                <button id="repeat-dialogue" class="dialogue-repeat" type="button">Repeat message</button>
              </div>
            </section>
          </div>

          <div id="student-stage" class="story-character-row story-user-row" hidden>
            <section class="story-dialogue" aria-label="Leo speaking">
              <p class="dialogue-eyebrow"><span id="student-speaker">Leo</span><span id="student-progress"></span></p>
              <p id="student-dialogue-copy" class="dialogue-copy" aria-live="polite"></p>
              <div class="dialogue-actions">
                <button id="ask-student-question" class="student-ask-button" type="button" hidden>Ask Dr. Fredrick</button>
                <button id="play-student-narration" class="dialogue-play" type="button">Play voice narration</button>
                <button id="continue-student-reading" class="dialogue-reading" type="button" hidden>Continue reading</button>
                <button id="repeat-student-dialogue" class="dialogue-repeat" type="button">Repeat message</button>
              </div>
            </section>
            <figure class="story-listener">
              <img id="visitor-character" src="../images/Boy_user_listening.png" alt="Leo speaking with Dr. Fredrick">
              <figcaption id="visitor-caption">Leo</figcaption>
            </figure>
          </div>
          <p id="speech-status" class="speech-status" role="status" aria-live="polite"></p>

          <section class="story-evidence" aria-label="Evidence investigation">
            <button id="mission-evidence-toggle" class="evidence-toggle" type="button" aria-expanded="false" aria-controls="mission-evidence-panel"></button>
            <p id="mission-evidence-panel" class="evidence-panel" hidden></p>
            <button id="uncertainty-toggle" class="evidence-toggle uncertainty-toggle" type="button" aria-expanded="false" aria-controls="uncertainty-panel" hidden>What remains uncertain?</button>
            <p id="uncertainty-panel" class="evidence-panel" hidden></p>
            <p id="final-mantra" class="final-mantra" hidden>The signal may end. The evidence remains.</p>
          </section>
        </section>

        <nav class="story-controls" aria-label="Story navigation">
          <button id="story-previous-slide" class="story-control-button story-control-button--previous" type="button" disabled>Previous</button>
          <p id="story-status" class="story-status" aria-live="polite"></p>
          <button id="story-advance-slide" class="story-control-button story-control-button--next" type="button">Next</button>
        </nav>
      </div>
    </section>
  </main>

  <a id="mission-image-source-link" class="mission-image-source-control" target="_blank" rel="noopener noreferrer" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M14 4h6v6m-.5-5.5L11 13M18 13v6H5V6h6" /></svg>
    <span></span>
  </a>

  <section id="landing-location-view" class="location-view" role="dialog" aria-modal="true" aria-label="Interactive Mars mission atlas" aria-hidden="true" hidden>
    <header class="atlas-header">
      <span class="atlas-world-label" data-atlas-world-label>MARS ATLAS</span>
      <div class="atlas-header-actions">
        <button type="button" data-atlas-reset-view aria-label="Reset globe orientation">Reset view</button>
        <button class="location-close" type="button" data-location-close aria-label="Return to mission exhibit">×</button>
      </div>
    </header>
    <div class="atlas-map-stage" data-atlas-map-stage>
      <canvas class="location-globe" aria-label="Interactive three-dimensional Mars globe; drag to rotate"></canvas>
      <div class="atlas-marker-layer" data-atlas-marker-layer></div>
      <div class="atlas-selection-overlay" data-atlas-selection hidden>
        <strong data-atlas-selection-name></strong>
        <span data-atlas-selection-details></span>
        <button type="button" data-atlas-exhibit-link>OPEN MISSION EXHIBIT ↗</button>
      </div>
      <span class="atlas-visualization-note" data-atlas-visualization-note hidden></span>
    </div>
    <section class="atlas-timeline" aria-label="Mission event timeline">
      <div class="atlas-timeline-heading">
        <span data-atlas-year-label aria-live="polite"></span>
        <span data-atlas-event-count></span>
      </div>
      <div class="atlas-year-controls">
        <button type="button" data-atlas-year-previous aria-label="Previous year">‹</button>
        <label><span class="sr-only">Mission timeline year</span><input data-atlas-year-slider type="range" min="1975" max="2024" step="1" value="1975"></label>
        <button type="button" data-atlas-year-next aria-label="Next year">›</button>
      </div>
      <div class="atlas-timeline-rail" data-atlas-timeline-rail aria-label="Mission events across history"></div>
      <div class="atlas-event-strip" data-atlas-year-events aria-live="polite"></div>
    </section>
  </section>

  <noscript><p class="noscript-notice">The Mars archive requires JavaScript to navigate its story.</p></noscript>
  <script src="../location-view.js?v=source-position-raf-20261111"></script>
  <script src="./mission-atlas-data.js?v=mars-atlas-data-20261113"></script>
  <script src="../mission-atlas.js"></script>
  <script src="../Audio/background-music.js"></script>
  <script src="../voice-selection.js"></script>
  <script src="./mars-data.js?v=mars-mission-integrations-20261116"></script>
  <script src="./mars-storytelling.js?v=mars-mission-integrations-20261116"></script>
</body>
</html>
